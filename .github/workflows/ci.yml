# Below is a GitHub Actions workflow configuration for Continuous Integration (CI).

name: CI
run-name: CI build initiated by ${{ github.actor }}

on:
    push:
        branches: ["main"]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
jobs:
    # ---------------------------------------------
    # BACKEND CI JOB
    # Runs linting, formatting, migrations, and tests
    # Uses Postgres service container
    # ---------------------------------------------
    backend:
        name: Backend (lint + test)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: app_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d app_test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
            ENV: test

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install uv # Cache uv if CI starts to slow down due to dependency installs
              run: pip install uv

            - name: Install backend deps
              working-directory: backend
              run: uv sync --frozen

            - name: Run migrations
              working-directory: backend
              run: uv run alembic upgrade head

            - name: Lint (ruff)
              working-directory: backend
              run: uv run ruff check .

            - name: Format check (ruff)
              working-directory: backend
              run: uv run ruff format --diff .

            - name: Run tests (pytest)
              working-directory: backend
              run: uv run pytest -q

    # ---------------------------------------------
    # FRONTEND CI JOB
    # Runs linting and build checks for the Next.js app
    # Ensures TypeScript, ESLint, and Next build all pass
    # Prevents broken UI from being merged
    # ---------------------------------------------
    frontend:
        name: Frontend (lint + build)
        runs-on: ubuntu-latest

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                node-version: "20"
                cache: "pnpm"
                cache-dependency-path: frontend/pnpm-lock.yaml


            - name: Enable pnpm
              run: corepack enable

            - name: Install frontend deps
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Lint
              working-directory: frontend
              run: pnpm lint

            - name: Build
              working-directory: frontend
              run: pnpm build

    # ---------------------------------------------
    # DOCKER BUILD SANITY CHECK
    # Ensures Dockerfiles for backend and frontend build successfully
    # Catches Docker-specific issues early (missing files, bad COPY paths)
    # Does NOT run containers or deploy images
    # ---------------------------------------------
    docker-build:
        name: Docker Build (sanity)
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Build backend image
              run: docker build -t ri-backend:ci ./backend

            - name: Build frontend image
              run: docker build -t ri-backend:ci ./frontend
