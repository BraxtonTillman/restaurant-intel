name: CI
run-name: CI build initiated by ${{ github.actor }}

on:
    push:
        branches: ["main"]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (lint + test)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: app_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d app_test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
            ENV: test

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: Install uv
              run: pip install uv

            - name: Cache uv dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/uv
                key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
                restore-keys: |
                  ${{ runner.os }}-uv-

            - name: Install backend deps
              working-directory: backend
              run: uv sync --frozen --all-groups

            - name: Run migrations
              working-directory: backend
              run: uv run alembic -c app/db/alembic.ini upgrade head

            - name: Lint (ruff)
              working-directory: backend
              run: uv run ruff check .

            - name: Format check (ruff)
              working-directory: backend
              run: uv run ruff format --diff .

            - name: Run tests (pytest)
              working-directory: backend
              run: uv run pytest -v --tb=short

    frontend:
        name: Frontend (lint + build)
        runs-on: ubuntu-latest

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                node-version: "20"
                cache: "pnpm"
                cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install frontend deps
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Lint
              working-directory: frontend
              run: pnpm lint

            - name: Build
              working-directory: frontend
              run: pnpm build

    docker-build:
        name: Docker Build (sanity)
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Build backend image
              run: docker build -t ri-backend:ci ./backend

            - name: Build frontend image
              run: docker build -t ri-frontend:ci ./frontend
